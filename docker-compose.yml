version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # URL que el NAVEGADOR usará para llamar al backend
        NEXT_PUBLIC_API_URL: http://localhost:3001
    container_name: grace-hub
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # URL que el SERVIDOR Next.js usa internamente (server components / actions)
      API_URL: http://host.docker.internal:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped